<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | JASG Automotriz</title>
<style>
:root{font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f172a}.login-card{width:min(100%,420px);padding:34px;background:#fff;border-radius:22px;box-shadow:0 20px 60px #0006}.brand{text-align:center;margin-bottom:26px}.brand-mark{width:74px;height:74px;margin:0 auto 14px;display:grid;place-items:center;border:2px solid #d4a72c;border-radius:18px;background:#111827;color:#d4a72c;font-size:34px}h1{margin:0;color:#172033;font-size:25px}.subtitle{margin:8px 0 0;color:#64748b;font-size:14px}label{display:block;margin:16px 0 7px;color:#172033;font-size:13px;font-weight:700}input,button{width:100%;min-height:46px;border-radius:10px;font:inherit}input{padding:0 13px;border:1px solid #cbd5e1;background:#f8fafc;color:#172033}button{margin-top:22px;border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.7;cursor:wait}#login-error{min-height:20px;margin:14px 0 0;color:#e11d48;text-align:center;font-size:13px}
</style></head>
<body><main class="login-card"><div class="brand"><div class="brand-mark">J</div><h1>JASG Automotriz</h1><p class="subtitle">Acceso al sistema</p></div><form id="login-form"><label for="login-user">Usuario o correo</label><input id="login-user" value="demo" autocomplete="username" required><label for="login-password">Contraseña</label><input id="login-password" type="password" value="demo1234" autocomplete="current-password" required><button id="login-button" type="submit">Ingresar</button><p id="login-error" role="alert"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=3"></script><script>
(function(){const f=document.getElementById('login-form'),b=document.getElementById('login-button'),e=document.getElementById('login-error');f.addEventListener('submit',async function(x){x.preventDefault();e.textContent='';if(!window.jasgSupabase){e.textContent='No se pudo conectar con el servidor.';return}b.disabled=true;const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-password').value,r=await window.jasgSupabase.auth.signInWithPassword({email:u.includes('@')?u:u+'@jasg.cl',password:p});b.disabled=false;if(r.error){e.textContent='Usuario o contraseña incorrectos.';return}location.href='index.html'})}());
</script></body></html>
