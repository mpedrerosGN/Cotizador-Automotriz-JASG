<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acceso - JASG Automotriz">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;font-family:Arial,sans-serif;color:#0f172a}.card{width:min(100%,420px);background:#fff;border-radius:24px;padding:32px;box-shadow:0 24px 60px #0006}.brand{text-align:center;margin-bottom:24px}.logo{width:76px;height:76px;margin:0 auto 14px;display:grid;place-items:center;border:2px solid #d4a72c;border-radius:18px;background:#111;color:#d4a72c;font-size:38px}h1{margin:0;font-size:25px}p{color:#64748b;font-size:14px}label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700}input,button{width:100%;border-radius:11px;padding:13px;font-size:15px}input{border:1px solid #cbd5e1;background:#f8fafc}button{margin-top:20px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}#login-error{color:#e11d48;text-align:center;display:none}</style>
</head>
<body><main class="card"><div class="brand"><div class="logo">◈</div><h1>JASG Automotriz</h1><p>Acceso al sistema</p></div><form id="login-form"><label>Usuario o correo</label><input id="login-user" value="demo" required><label>Contraseña</label><input id="login-password" type="password" value="demo1234" required><button type="submit">Ingresar</button><p id="login-error"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=2"></script><script>document.getElementById('login-form').addEventListener('submit',async function(e){e.preventDefault();const box=document.getElementById('login-error'),u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-password').value;if(!window.jasgSupabase){box.textContent='No se pudo conectar con el servidor.';box.style.display='block';return}const r=await window.jasgSupabase.auth.signInWithPassword({email:u.includes('@')?u:u+'@jasg.cl',password:p});if(r.error){box.textContent='Usuario o contraseña incorrectos.';box.style.display='block';return}location.href='index.html'});</script></body></html>
