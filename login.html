<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acceso - JASG Automotriz"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=1"></script></head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-slate-800">
<main class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-7"><div class="text-center mb-6"><div class="mx-auto w-20 h-20 rounded-2xl bg-slate-900 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-4xl">◈</div><h1 class="mt-4 text-2xl font-black">JASG Automotriz</h1><p class="text-sm text-slate-500">Acceso al sistema</p></div>
<form id="login-form" class="space-y-4"><div><label class="block text-sm font-semibold mb-1">Usuario o correo</label><input id="login-user" value="demo" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl"></div><div><label class="block text-sm font-semibold mb-1">Contraseña</label><input id="login-password" type="password" value="demo1234" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl"></div><button class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold">Ingresar</button><p id="login-error" class="hidden text-sm text-rose-600 text-center"></p></form></main>
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => { event.preventDefault(); const user = document.getElementById('login-user').value.trim(); const password = document.getElementById('login-password').value; const email = user.includes('@') ? user : `${user}@jasg.cl`; const { error } = await window.jasgSupabase.auth.signInWithPassword({ email, password }); if (error) { const box = document.getElementById('login-error'); box.textContent = 'Usuario o contraseña incorrectos. Verifica que la cuenta demo exista en Supabase Auth.'; box.classList.remove('hidden'); return; } location.href = 'index.html'; });
</script></body></html>
