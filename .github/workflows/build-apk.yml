name: Construir APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.0-online
          name: JASG Automotriz Android v1.1.0-online
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: "Versión v1.1.0-online: la APK carga la versión web publicada y recibe automáticamente los cambios del sistema."
